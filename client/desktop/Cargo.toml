[package]
name = "thehideout-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "thehideout-desktop"
path = "src/main.rs"

[features]
# The camera: `thehideout-voice`'s nokhwa (AVFoundation) capture. On by default; build with
# `--no-default-features` for a binary whose camera button reports "camera unsupported".
default = ["camera"]
camera = ["thehideout-voice/camera"]

[lib]
# The browser entry (`src/lib.rs`, wasm32 only; empty natively). The desktop app is the `bin`.
crate-type = ["cdylib"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
rune = { workspace = true }
rune-kit = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thehideout-api = { workspace = true }
thehideout-design = { workspace = true }
thehideout-voice-types = { path = "../voice-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
rune = { workspace = true, features = ["tooling", "native-file-dialog"] }
thehideout-voice = { path = "../voice" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
rune = { workspace = true, features = ["webgl"] }
tokio = { version = "1", features = ["sync", "macros"] }
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Location", "Navigator",
    "Storage", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "XmlHttpRequest", "XmlHttpRequestUpload",
    "XmlHttpRequestResponseType", "ProgressEvent", "Event", "EventTarget", "console", "CssStyleDeclaration",
] }

[dev-dependencies]
axum = "0.8"
rand = "0.9"
totp-rs = { version = "5", features = ["otpauth"] }
scylla = { version = "1", features = ["chrono-04"] }
thehideout-server = { path = "../../server" }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

# macOS bundle, built by `packaging/macos/build.sh` with cargo-packager (`cargo install cargo-packager`).
[package.metadata.packager]
product-name = "thehideout"
identifier = "si.zabit.thehideout"
category = "SocialNetworking"
description = "thehideout desktop client"
formats = ["app"]
icons = ["../packaging/macos/AppIcon.icns"]
binaries = [{ path = "thehideout-desktop", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "../packaging/macos/Info.plist"
entitlements = "../packaging/macos/Entitlements.plist"
