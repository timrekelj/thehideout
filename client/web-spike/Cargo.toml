[package]
name = "thehideout-web-spike"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Throwaway Phase 0 spike: thehideout-api in the browser (login, a unary call, live gateway events)"

# Not a workspace default member: native builds and CI never touch it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { workspace = true }
thehideout-api = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }
