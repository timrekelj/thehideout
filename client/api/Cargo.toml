[package]
name = "thehideout-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Typed client for the thehideout server: plain domain types and a self-reconnecting gateway"

[dependencies]
base64 = "0.22"
bytes = "1"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["gzip", "json"] }
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
connectrpc = { version = "0.9", features = ["client", "client-tls"] }
hyper = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
webpki-roots = "0.26"

# The browser transport (`src/fetch.rs`) and runtime shim (`src/runtime.rs`).
# getrandom's `wasm_js` backend also needs `--cfg getrandom_backend="wasm_js"`, set in
# client/.cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Event", "EventTarget", "Headers", "ProgressEvent",
    "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "Response", "XmlHttpRequest",
    "XmlHttpRequestUpload",
] }

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
axum = "0.8"
rand = "0.9"
scylla = { version = "1", features = ["chrono-04"] }
thehideout-server = { path = "../../server" }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
