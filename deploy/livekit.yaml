# LiveKit production config TEMPLATE. The `livekit-config` compose service fills
# in the __PLACEHOLDERS__ from .env.production and writes the result to a volume;
# do not put real secrets in this file.
#
# Signalling (7880) is only reachable inside the compose network: Caddy proxies
# it as wss://$LIVEKIT_DOMAIN. Media uses the host's public IP.
port: 7880
log_level: info

rtc:
  # ICE/TCP fallback and the UDP media range. Open them in the firewall and keep
  # the range in sync with LIVEKIT_UDP_START / LIVEKIT_UDP_END (published by compose).
  tcp_port: 7881
  port_range_start: __LIVEKIT_UDP_START__
  port_range_end: __LIVEKIT_UDP_END__
  # Discover the server's public IP via STUN and advertise it to clients.
  use_external_ip: true

# Built-in TURN server for clients behind restrictive NATs / firewalls.
turn:
  enabled: true
  domain: __LIVEKIT_TURN_DOMAIN__
  # TURN over UDP (published as 3478/udp). No certificate needed.
  udp_port: 3478
  # Optional TURN over TLS for networks that block UDP. 443 is taken by Caddy, so
  # use 5349 with a certificate for the TURN domain, e.g. Caddy's, by mounting
  # its `caddy-data` volume read-only into the livekit service:
  #   tls_port: 5349
  #   cert_file: /caddy/certificates/acme-v02.api.letsencrypt.org-directory/<domain>/<domain>.crt
  #   key_file:  /caddy/certificates/acme-v02.api.letsencrypt.org-directory/<domain>/<domain>.key
  # and publish 5349:5349 in compose.yml. See README.md.

keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__

# Room / participant events go to the server, signed with the key above.
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - http://server:8080/livekit/webhook
