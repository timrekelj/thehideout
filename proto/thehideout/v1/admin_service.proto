syntax = "proto3";

package thehideout.v1;

import "google/protobuf/timestamp.proto";
import "thehideout/v1/types.proto";

// Site-wide administration dashboard. Every call requires the caller to be a
// site admin (`User.is_admin`); otherwise PERMISSION_DENIED.
//
// Bootstrap: the environment variable THEHIDEOUT_ADMINS (comma-separated
// usernames) lists users who are promoted to admin at server startup (if they
// already exist) and at sign-up (if they register later). Further admins are
// made with SetAdmin.
service AdminService {
  // Site-wide totals and today's counters.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Per-day activity for the last N days.
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  // Lists all guilds with usage numbers.
  rpc ListGuilds(ListGuildsRequest) returns (ListGuildsResponse);
  // Lists all users with usage numbers.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Grants or revokes site-admin rights.
  rpc SetAdmin(SetAdminRequest) returns (SetAdminResponse);
  // Lists stored files, largest first.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // Deletes a stored file and its owner reference; writes an audit entry.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // Lists audit entries, newest first.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);
  // Suspends a user: sessions are revoked and sign-in is refused with a
  // `thehideout.v1.AccountSuspended` detail until `until` (or unsuspended).
  // Site admins cannot be suspended (FAILED_PRECONDITION). Audit-logged.
  rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse);
  // Lifts a suspension. Audit-logged.
  rpc UnsuspendUser(UnsuspendUserRequest) returns (UnsuspendUserResponse);
  // Deletes (anonymizes) a user's account like the user's own DeleteAccount.
  // Refused for site admins and the bootstrap admin (FAILED_PRECONDITION).
  // Without `force_transfer` it fails with FAILED_PRECONDITION and an
  // `OwnedGuilds` detail while the user owns guilds; with it, ownership of each
  // guild passes to its member with the highest role (ties: the longest
  // member) and guilds where the user is alone are deleted. Audit-logged.
  rpc AdminDeleteUser(AdminDeleteUserRequest) returns (AdminDeleteUserResponse);
}

// Bytes of stored media per category.
message StorageBreakdown {
  // Message attachments (files and their thumbnails).
  uint64 attachments = 1;
  // Custom emoji images.
  uint64 emojis = 2;
  // Guild icons.
  uint64 guild_icons = 3;
  // User avatars.
  uint64 avatars = 4;
  // Link-embed thumbnails.
  uint64 embeds = 5;
}

// Request for the overview.
message GetOverviewRequest {}

// Site-wide totals. "Today" is the current UTC day.
message GetOverviewResponse {
  // Registered users.
  uint64 users = 1;
  // Guilds.
  uint64 guilds = 2;
  // Guild channels (DM channels excluded).
  uint64 channels = 3;
  // Messages, including DMs.
  uint64 messages = 4;
  // Total bytes of stored media (all kinds).
  uint64 storage_bytes_total = 5;
  // Bytes of stored avatars.
  uint64 storage_bytes_avatars = 6;
  // Bytes of stored guild icons.
  uint64 storage_bytes_guild_icons = 7;
  // Currently open gateway streams on this node.
  uint64 live_connections = 8;
  // Messages sent today.
  uint64 messages_today = 9;
  // Accounts created today.
  uint64 signups_today = 10;
  // Distinct users who sent a message or opened a gateway stream today.
  uint64 active_users_today = 11;
  // Global storage per category (sums to storage_bytes_total).
  StorageBreakdown storage = 12;
}

// Request for per-day activity.
message GetActivityRequest {
  // Number of days to return, ending today (inclusive). 1..=90; 0 means the
  // default of 30; larger values are INVALID_ARGUMENT.
  uint32 days = 1;
}

// One day of activity.
message ActivityPoint {
  // UTC date, formatted "YYYY-MM-DD".
  string date = 1;
  // Messages sent that day.
  uint64 messages = 2;
  // Accounts created that day.
  uint64 signups = 3;
  // Distinct active users that day (same definition as active_users_today).
  uint64 active_users = 4;
}

// Per-day activity.
message GetActivityResponse {
  // One point per day, oldest first, with zero-filled gaps.
  repeated ActivityPoint points = 1;
}

// Request to list guilds.
message ListGuildsRequest {
  // Token from a previous response's `next_page_token`; "" for the first page.
  string page_token = 1;
  // Maximum rows to return; 0 = default (50); capped at 200.
  uint32 limit = 2;
  // Case-insensitive substring filter on the guild name; "" = no filter.
  string query = 3;
}

// A guild with usage numbers.
message AdminGuildRow {
  // The guild.
  Guild guild = 1;
  // Members.
  uint64 member_count = 2;
  // Channels.
  uint64 channel_count = 3;
  // Messages in the guild's channels.
  uint64 message_count = 4;
  // Bytes of media owned by the guild (its icon).
  uint64 storage_bytes = 5;
  // Per-category storage of the guild (`avatars` is always 0 here); embeds
  // count towards the guild owning the message's channel.
  StorageBreakdown storage = 6;
}

// A page of guilds.
message ListGuildsResponse {
  // Guild rows.
  repeated AdminGuildRow guilds = 1;
  // Token for the next page; "" if this was the last page.
  string next_page_token = 2;
}

// Request to list users.
message ListUsersRequest {
  // Token from a previous response's `next_page_token`; "" for the first page.
  string page_token = 1;
  // Maximum rows to return; 0 = default (50); capped at 200.
  uint32 limit = 2;
  // Case-insensitive substring filter on the username; "" = no filter.
  string query = 3;
}

// A user with usage numbers.
message AdminUserRow {
  // The user (includes `is_admin`).
  User user = 1;
  // Guilds the user is a member of.
  uint64 guild_count = 2;
  // Messages the user has sent.
  uint64 message_count = 3;
  // Bytes of media owned by the user (their avatar).
  uint64 storage_bytes = 4;
  // Last time the user sent a message or opened a gateway stream; unset if never.
  optional google.protobuf.Timestamp last_active_at = 5;
  // The user is currently suspended.
  bool suspended = 6;
  // When the suspension ends; unset = indefinite (only with `suspended`).
  optional google.protobuf.Timestamp suspended_until = 7;
  // The suspension reason (only with `suspended`).
  string suspended_reason = 8;
  // The account was deleted (anonymized) or is being deleted.
  bool deleted = 9;
}

// Request to suspend a user.
message SuspendUserRequest {
  // The user; NOT_FOUND if unknown.
  uint64 user_id = 1;
  // Shown to the user on sign-in and kept in the audit log (≤ 512 chars).
  string reason = 2;
  // When it ends; unset = until lifted. Must be in the future.
  optional google.protobuf.Timestamp until = 3;
}

// The user after suspension.
message SuspendUserResponse {
  // The suspended user's row.
  AdminUserRow user = 1;
}

// Request to lift a suspension.
message UnsuspendUserRequest {
  // The user; NOT_FOUND if unknown.
  uint64 user_id = 1;
}

// The user after the change.
message UnsuspendUserResponse {
  // The user's row.
  AdminUserRow user = 1;
}

// Request to delete a user's account.
message AdminDeleteUserRequest {
  // The user; NOT_FOUND if unknown or already deleted.
  uint64 user_id = 1;
  // Hand guilds over or delete them (see the RPC).
  bool force_transfer = 2;
  // Kept in the audit log (≤ 512 chars).
  string reason = 3;
}

// The deletion was accepted.
message AdminDeleteUserResponse {}

// A page of users.
message ListUsersResponse {
  // User rows.
  repeated AdminUserRow users = 1;
  // Token for the next page; "" if this was the last page.
  string next_page_token = 2;
}

// Request to grant or revoke admin rights.
message SetAdminRequest {
  // ID of the user to change; NOT_FOUND if unknown.
  uint64 user_id = 1;
  // true = make admin, false = revoke. Revoking fails with FAILED_PRECONDITION
  // if `user_id` is the caller (admins cannot demote themselves) or if the
  // user is the last remaining admin. Admins promoted via THEHIDEOUT_ADMINS are
  // re-promoted at the next startup.
  bool is_admin = 2;
}

// Result of changing admin rights.
message SetAdminResponse {
  // The user after the change.
  User user = 1;
}

// Category of a stored file.
enum AdminFileKind {
  // Not a kind; as a filter = all kinds.
  ADMIN_FILE_KIND_UNSPECIFIED = 0;
  // Message attachment (file or its thumbnail).
  ADMIN_FILE_KIND_ATTACHMENT = 1;
  // Custom emoji image.
  ADMIN_FILE_KIND_EMOJI = 2;
  // Guild icon.
  ADMIN_FILE_KIND_GUILD_ICON = 3;
  // User avatar.
  ADMIN_FILE_KIND_AVATAR = 4;
  // Link-embed thumbnail.
  ADMIN_FILE_KIND_EMBED_THUMBNAIL = 5;
}

// Request to list stored files.
message ListFilesRequest {
  // Only files owned by this guild; unset = all (including avatars).
  optional uint64 guild_id = 1;
  // Only this kind; unset or UNSPECIFIED = all.
  optional AdminFileKind kind = 2;
  // Token from a previous response; "" for the first page.
  string page_token = 3;
  // Maximum rows; 0 = default (50); capped at 200.
  uint32 limit = 4;
}

// A stored file with its owner.
message AdminFileRow {
  // Media key of the object.
  string key = 1;
  // What the file is.
  AdminFileKind kind = 2;
  // Original file name (attachments only); "" otherwise.
  string filename = 3;
  // Size in bytes.
  uint64 bytes = 4;
  // MIME type of the stored object.
  string content_type = 5;
  // Owning guild, if any (not for avatars or DMs).
  optional Guild guild = 6;
  // Owning user (avatar owner, attachment author, emoji creator).
  optional User owner = 7;
  // Channel of the message (attachments and embeds).
  optional uint64 channel_id = 8;
  // Message (attachments and embeds).
  optional uint64 message_id = 9;
  // When the object was stored.
  google.protobuf.Timestamp created_at = 10;
}

// A page of files, sorted by `bytes` descending (ties by key).
message ListFilesResponse {
  // File rows.
  repeated AdminFileRow files = 1;
  // Token for the next page; "" if last.
  string next_page_token = 2;
}

// Request to delete a stored file.
message DeleteFileRequest {
  // Media key; NOT_FOUND if unknown.
  string key = 1;
  // Free-text reason recorded in the audit log.
  string reason = 2;
}

// Result of deleting a file.
message DeleteFileResponse {}

// Request to list audit entries.
message ListAuditLogRequest {
  // Token from a previous response; "" for the first page.
  string page_token = 1;
  // Maximum rows; 0 = default (50); capped at 200.
  uint32 limit = 2;
}

// One audit record.
message AuditEntry {
  // Unique Snowflake ID.
  uint64 id = 1;
  // The admin who acted.
  User actor = 2;
  // Action name, e.g. "file.delete", "admin.grant", "admin.revoke".
  string action = 3;
  // What was acted on (media key, user ID, ...), action-specific.
  string target = 4;
  // Free-text reason; "" if none.
  string reason = 5;
  // When it happened.
  google.protobuf.Timestamp created_at = 6;
}

// A page of audit entries, newest first.
message ListAuditLogResponse {
  // Entries.
  repeated AuditEntry entries = 1;
  // Token for the next page; "" if last.
  string next_page_token = 2;
}
