syntax = "proto3";

package thehideout.v1;

import "google/protobuf/timestamp.proto";

// A registered TheHideout user.
message User {
  // Unique Snowflake ID of the user.
  uint64 id = 1;
  // Unique, human-readable username.
  string username = 2;
  // When the account was created.
  google.protobuf.Timestamp created_at = 3;
  // Opaque media key of the user's avatar; "" = no avatar (clients render a
  // default). Load it from `GET {base}/media/{key}` (see media_service.proto).
  string avatar = 4;
  // Whether the user is a site administrator (see admin_service.proto).
  bool is_admin = 5;
  // The account's email address. Only set for the user themself and for site
  // admins; unset for other viewers and for legacy accounts without an email.
  optional string email = 6;
}

// A guild (a Discord-style server) that groups members and channels.
message Guild {
  // Unique Snowflake ID of the guild.
  uint64 id = 1;
  // Display name of the guild.
  string name = 2;
  // ID of the user who owns the guild.
  uint64 owner_id = 3;
  // Code other users can use to join the guild.
  string invite_code = 4;
  // When the guild was created.
  google.protobuf.Timestamp created_at = 5;
  // Opaque media key of the guild icon; "" = no icon. Load it from
  // `GET {base}/media/{key}` (see media_service.proto).
  string icon = 6;
}

// A text or voice channel inside a guild.
message Channel {
  // Unique Snowflake ID of the channel.
  uint64 id = 1;
  // ID of the guild the channel belongs to.
  uint64 guild_id = 2;
  // Display name of the channel.
  string name = 3;
  // When the channel was created.
  google.protobuf.Timestamp created_at = 4;
  // Section the channel is in; unset = top level (unsectioned).
  optional uint64 section_id = 5;
  // 0-based position among the channels of the same section (or among the
  // unsectioned channels). Informational mirror of GuildLayout, which is
  // authoritative.
  int32 position = 6;
  // Phosphor icon name, e.g. "game-controller"; "" = default (clients derive
  // a hash icon from the channel). DEPRECATED mirror of `icon_ref`: set only
  // when icon_ref is a phosphor icon, "" otherwise. Validated by the server against
  // `^[a-z0-9]+(-[a-z0-9]+)*$`, at most 48 characters.
  string icon = 7;
  // Palette key (see "Colour palette" above Section); "" = none.
  string color = 8;
  // Free-text topic, at most 256 characters; "" = none.
  string topic = 9;
  // Authoritative three-way icon (Phosphor / Unicode emoji / custom emoji).
  // Unset = default icon. `icon` above mirrors it for old readers.
  ChannelIcon icon_ref = 10;
  // Text or voice. Set at creation and never changes. `CHANNEL_KIND_UNSPECIFIED`
  // (channels created before voice existed, and old servers) means TEXT.
  ChannelKind kind = 11;
}

// What a channel is for.
enum ChannelKind {
  // Treat as TEXT (rows and servers that predate voice channels).
  CHANNEL_KIND_UNSPECIFIED = 0;
  // A text channel: messages, reactions, attachments.
  CHANNEL_KIND_TEXT = 1;
  // A voice channel: members join it with VoiceService.JoinVoice to talk, share
  // their camera or screen through LiveKit. SendMessage fails with
  // FAILED_PRECONDITION; it has no message history.
  CHANNEL_KIND_VOICE = 2;
}

// Who is in a voice channel and how. Kept in server memory only (lost on
// restart, see README "Voice"); one per user at most (a user is in at most one
// voice channel at a time).
message VoiceState {
  // Guild of the voice channel.
  uint64 guild_id = 1;
  // The voice channel the user is in.
  uint64 channel_id = 2;
  // The user.
  uint64 user_id = 3;
  // The user muted their own microphone (client-reported, advisory).
  bool self_mute = 4;
  // The user deafened themself (client-reported, advisory).
  bool self_deaf = 5;
  // A moderator muted the user. Enforced: the user's LiveKit token and room
  // permissions no longer allow publishing a microphone track.
  bool server_mute = 6;
  // The user is publishing their camera (client-reported).
  bool self_video = 7;
  // The user is sharing their screen (client-reported).
  bool self_stream = 8;
  // When the user joined (or was moved into) the channel.
  google.protobuf.Timestamp joined_at = 9;
}

// A channel icon: exactly one of a Phosphor icon, a Unicode emoji or one of
// the guild's custom emojis. An unset `kind` means "default icon".
message ChannelIcon {
  oneof kind {
    // Phosphor icon name, validated against `^[a-z0-9]+(-[a-z0-9]+)*$`, at
    // most 48 characters.
    string phosphor = 1;
    // A single Unicode emoji grapheme cluster, at most 32 bytes.
    string unicode = 2;
    // ID of a custom Emoji of the SAME guild as the channel.
    uint64 custom_emoji_id = 3;
  }
}

// A custom emoji owned by a guild (see emoji_service.proto).
message Emoji {
  // Unique Snowflake ID of the emoji.
  uint64 id = 1;
  // ID of the guild that owns the emoji.
  uint64 guild_id = 2;
  // Name matching `^[a-z0-9_]{2,32}$`, unique per guild.
  string name = 3;
  // True if the image is an animation (stored as GIF); false = static (WebP).
  bool animated = 4;
  // Opaque media key of the image; fetch `GET {base}/media/{key}`.
  string image = 5;
  // ID of the user who created the emoji.
  uint64 creator_id = 6;
  // When the emoji was created.
  google.protobuf.Timestamp created_at = 7;
}

// The emoji of a reaction: a Unicode emoji or a custom emoji.
message ReactionEmoji {
  oneof kind {
    // A single Unicode emoji grapheme cluster, at most 32 bytes.
    string unicode = 1;
    // ID of a custom Emoji of the channel's guild (never valid in DMs).
    uint64 custom_emoji_id = 2;
  }
}

// Aggregated reactions of one emoji on a message.
message Reaction {
  // The emoji.
  ReactionEmoji emoji = 1;
  // Number of users who reacted with it.
  uint32 count = 2;
  // Whether the requesting user is among them. In gateway events (shared
  // across recipients) this is always false; clients maintain it locally from
  // reaction_added / reaction_removed events carrying their own user_id.
  bool me = 3;
}

// A file attached to a message. Uploaded via `POST /attachments` (see
// message_service.proto / README) and linked by SendMessage.
message Attachment {
  // Unique Snowflake ID.
  uint64 id = 1;
  // Original file name (sanitised, no path components).
  string filename = 2;
  // MIME type as declared at upload.
  string content_type = 3;
  // Size in bytes.
  uint64 size = 4;
  // Opaque media key of the file; fetch `GET {base}/media/{key}`. Empty if
  // `removed`.
  string file = 5;
  // Pixel width (images only).
  optional uint32 width = 6;
  // Pixel height (images only).
  optional uint32 height = 7;
  // Media key of a WebP thumbnail, at most 400 px on the longer side (images
  // only). Unset otherwise, and empty if `removed`.
  optional string thumbnail = 8;
  // True after a site admin deleted the file; `file` and `thumbnail` are then
  // empty and clients show a "removed" placeholder.
  bool removed = 9;
}

// A link preview produced by the server for a URL in a message.
message Embed {
  // The URL the embed was built from (http or https).
  string url = 1;
  // Page title; "" if none.
  string title = 2;
  // Page description; "" if none.
  string description = 3;
  // Site name (og:site_name or host); "" if none.
  string site_name = 4;
  // Media key of the preview image (WebP, stored in S3).
  optional string thumbnail = 5;
  // Pixel width of the thumbnail.
  optional uint32 thumbnail_width = 6;
  // Pixel height of the thumbnail.
  optional uint32 thumbnail_height = 7;
  // What the embed shows; `EMBED_KIND_UNSPECIFIED` from servers that predate
  // rich embeds (treat as LINK).
  EmbedKind kind = 8;
  // Provider of a rich embed: "x", "tiktok", "instagram" or "reddit"; "" for a
  // generic link.
  string provider = 9;
  // Display name of the author or account (provider embeds); "" if none.
  string author_name = 10;
  // Profile URL of the author, if known (a link, never fetched by clients).
  optional string author_url = 11;
  // Media key of a small WebP avatar of the author, if cheap to get.
  optional string author_icon = 12;
  // Stored media in display order (at most 4): images, videos and GIFs
  // downloaded by the server. Empty for plain link embeds.
  repeated EmbedMedia media = 13;
  // When the post was published, if the provider says.
  optional google.protobuf.Timestamp published_at = 14;
}

// What an embed represents.
enum EmbedKind {
  EMBED_KIND_UNSPECIFIED = 0;
  // A page: title, description and an optional thumbnail.
  EMBED_KIND_LINK = 1;
  // A direct image link or a post whose media is only images.
  EMBED_KIND_IMAGE = 2;
  // A post whose media includes a video.
  EMBED_KIND_VIDEO = 3;
  // A post with text (and optionally media), e.g. a tweet or a Reddit post.
  EMBED_KIND_RICH = 4;
}

// One image, video or GIF of an embed, stored in S3 (served from `/media/{key}`).
message EmbedMedia {
  EmbedMediaKind kind = 1;
  // Media key: WebP (at most 1600 px on the longer side) for images, MP4 as
  // downloaded (not transcoded) for videos and GIFs.
  string file = 2;
  // Media key of a WebP still of a video, if the provider had one.
  optional string poster = 3;
  // Pixel width; 0 if unknown.
  uint32 width = 4;
  // Pixel height; 0 if unknown.
  uint32 height = 5;
  // Duration of a video or GIF in milliseconds, if known.
  optional uint32 duration_ms = 6;
  // Size of `file` in bytes.
  uint64 size = 7;
}

enum EmbedMediaKind {
  EMBED_MEDIA_KIND_UNSPECIFIED = 0;
  EMBED_MEDIA_KIND_IMAGE = 1;
  // A video with a sound track (when the source had one).
  EMBED_MEDIA_KIND_VIDEO = 2;
  // A looping, silent clip stored as MP4 (a GIF, or a video without audio):
  // clients autoplay it muted.
  EMBED_MEDIA_KIND_GIFV = 3;
}

// A direct-message channel between exactly two users. Its `id` is a channel
// ID usable with MessageService exactly like a guild channel's ID.
message DmChannel {
  // Unique Snowflake ID of the DM channel; also the `channel_id` of its messages.
  uint64 id = 1;
  // The two participants, ordered by user ID ascending.
  repeated User participants = 2;
  // When the DM channel was created.
  google.protobuf.Timestamp created_at = 3;
}

// A chat message posted in a channel.
message Message {
  // Unique Snowflake ID of the message; IDs increase with time.
  uint64 id = 1;
  // ID of the channel the message was posted in; a guild channel or a DM channel.
  uint64 channel_id = 2;
  // ID of the guild that owns the channel; 0 for direct-message channels.
  uint64 guild_id = 3;
  // ID of the user who wrote the message.
  uint64 author_id = 4;
  // Text content of the message.
  string content = 5;
  // When the message was created.
  google.protobuf.Timestamp created_at = 6;
  // When the message was last edited; unset if never edited.
  optional google.protobuf.Timestamp edited_at = 7;
  // Client-supplied nonce echoed back from SendMessage; empty if none was given.
  string nonce = 8;
  // Reactions, one entry per distinct emoji, ordered by first use.
  repeated Reaction reactions = 9;
  // Attached files (at most 10).
  repeated Attachment attachments = 10;
  // Link embeds (at most 3); filled asynchronously after the message is
  // created, announced by a `message_updated` event.
  repeated Embed embeds = 11;
}

// ---------------------------------------------------------------------------
// Colour palette
// ---------------------------------------------------------------------------
// Roles and channels reference colours by palette key; clients map keys to
// concrete colours. The only valid keys are exactly these 12 strings, and ""
// means "no colour":
//   "slate", "red", "orange", "amber", "yellow", "lime", "green", "teal",
//   "cyan", "blue", "indigo", "pink"
// The server rejects any other value with INVALID_ARGUMENT.

// A named group of channels inside a guild, used to organise the channel list.
message Section {
  // Unique Snowflake ID of the section; never 0.
  uint64 id = 1;
  // ID of the guild the section belongs to.
  uint64 guild_id = 2;
  // Display name, 1-100 characters.
  string name = 3;
  // 0-based position among the guild's sections. Informational mirror of
  // GuildLayout, which is authoritative.
  int32 position = 4;
}

// The channels of one section, in display order.
message LayoutEntry {
  // Section the channels belong to; 0 = top level (unsectioned channels).
  uint64 section_id = 1;
  // Channel IDs in display order.
  repeated uint64 channel_ids = 2;
}

// The ordered layout of a guild's channel list. Every channel of the guild
// appears in exactly one entry and every section has exactly one entry
// (possibly with no channels); the entry for section_id 0 is always present.
message GuildLayout {
  // Monotonic version, incremented on every layout change (section create /
  // delete, channel create / delete, UpdateLayout). Used for optimistic
  // concurrency in UpdateLayout.
  uint64 version = 1;
  // Sections in display order. Rename via UpdateSection.
  repeated Section sections = 2;
  // Channel ordering per section.
  repeated LayoutEntry entries = 3;
}

// ---------------------------------------------------------------------------
// Roles and permissions
// ---------------------------------------------------------------------------

// Permission bit flags. A permission set is a uint64 whose bits are the sum
// (OR) of these values. Rules:
//   - The guild owner implicitly has every permission.
//   - A member's permissions are the OR of the permissions of all their roles.
//   - ADMINISTRATOR implies every other permission.
//   - Hierarchy: non-owners can only manage (edit, delete, reorder, assign)
//     roles strictly below their own highest role, and can only grant
//     permissions they themselves hold. Only the owner is exempt.
//   - Voice defaults: there is no @everyone role, so CONNECT, SPEAK and VIDEO
//     are a baseline every member has, whether or not a role carries the bits
//     (the bits are accepted in roles and are harmless). MUTE_MEMBERS and
//     MOVE_MEMBERS are held by nobody by default; ADMINISTRATOR and the owner
//     imply them, and a role can grant them like any other permission (only
//     bits the granter holds).
enum Permission {
  // Not a permission; the zero value.
  PERMISSION_UNSPECIFIED = 0;
  // Implies all permissions.
  PERMISSION_ADMINISTRATOR = 1;
  // Update guild name and icon.
  PERMISSION_MANAGE_SERVER = 2;
  // Create / update channels and sections, and change the layout.
  PERMISSION_MANAGE_CHANNELS = 4;
  // Create / update / delete / reorder roles and assign them to members.
  PERMISSION_MANAGE_ROLES = 8;
  // Create / rename / delete custom emojis.
  PERMISSION_MANAGE_EMOJIS = 16;
  // Invite people by email to create an account; the invite auto-joins the
  // guild (see invite_service.proto).
  PERMISSION_INVITE_PEOPLE = 32;
  // Join voice channels. Granted to every member by default (see below).
  PERMISSION_CONNECT = 64;
  // Publish a microphone track in voice channels. Without it the member can
  // listen only. Granted to every member by default.
  PERMISSION_SPEAK = 128;
  // Publish a camera and share the screen (and its audio) in voice channels.
  // Needs SPEAK too (publishing is off without it). Granted to every member by
  // default.
  PERMISSION_VIDEO = 256;
  // Server-mute other members in voice channels. Subject to the role hierarchy.
  PERMISSION_MUTE_MEMBERS = 512;
  // Move other members between voice channels and disconnect them. Subject to
  // the role hierarchy.
  PERMISSION_MOVE_MEMBERS = 1024;
}

// A role within a guild.
message Role {
  // Unique Snowflake ID of the role.
  uint64 id = 1;
  // ID of the guild the role belongs to.
  uint64 guild_id = 2;
  // Display name, 1-100 characters.
  string name = 3;
  // Palette key; "" = none.
  string color = 4;
  // Seniority; higher = more senior. Positions are unique within a guild and
  // contiguous (0..n-1) after ReorderRoles.
  int32 position = 5;
  // Bitwise OR of Permission values.
  uint64 permissions = 6;
  // When the role was created.
  google.protobuf.Timestamp created_at = 7;
}

// A user's membership of a guild.
message Member {
  // The member's user.
  User user = 1;
  // IDs of the roles assigned to the member.
  repeated uint64 role_ids = 2;
  // When the user joined the guild.
  google.protobuf.Timestamp joined_at = 3;
}
