syntax = "proto3";

package thehideout.v1;

import "google/protobuf/timestamp.proto";
import "thehideout/v1/types.proto";

// Guilds (Discord-style servers), their members and their channels.
service GuildService {
  // Creates a guild owned by the caller.
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  // Lists the guilds the caller is a member of.
  rpc ListMyGuilds(ListMyGuildsRequest) returns (ListMyGuildsResponse);
  // Joins the guild identified by an invite code.
  rpc JoinGuild(JoinGuildRequest) returns (JoinGuildResponse);
  // Lists the members of a guild the caller belongs to.
  rpc ListGuildMembers(ListGuildMembersRequest) returns (ListGuildMembersResponse);
  // Creates a text channel in a guild.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // Lists the channels of a guild the caller belongs to.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  // Updates guild settings. Requires MANAGE_SERVER. Publishes GuildUpdated.
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse);
  // Updates a channel's name, icon, colour or topic. Requires MANAGE_CHANNELS.
  // Publishes ChannelUpdated.
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  // Creates a channel section (appended last). Requires MANAGE_CHANNELS.
  // Publishes LayoutUpdated.
  rpc CreateSection(CreateSectionRequest) returns (CreateSectionResponse);
  // Renames a section. Requires MANAGE_CHANNELS. Publishes LayoutUpdated.
  rpc UpdateSection(UpdateSectionRequest) returns (UpdateSectionResponse);
  // Deletes a section; its channels move to the top level, appended after the
  // existing unsectioned channels in their current order. Requires
  // MANAGE_CHANNELS. Publishes LayoutUpdated.
  rpc DeleteSection(DeleteSectionRequest) returns (DeleteSectionResponse);
  // Replaces the section order and the channel order/section assignment.
  // Requires MANAGE_CHANNELS. Publishes LayoutUpdated.
  rpc UpdateLayout(UpdateLayoutRequest) returns (UpdateLayoutResponse);
  // Removes a member. Requires KICK_MEMBERS and a top role strictly above the
  // target's (nobody but the owner can act on the owner; you cannot kick
  // yourself: use LeaveGuild). The member can rejoin with an invite code.
  // Publishes guild_member_removed (reason KICKED) and guild_removed to the
  // removed user. Audit-logged (`guild.kick`).
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  // Bans a member (or a former member): removes them like KickMember and
  // blocks them from rejoining this guild with an invite code. Requires
  // BAN_MEMBERS and the same hierarchy rule as KickMember. Optionally deletes
  // their recent messages in the guild's channels, in the background (at most
  // 7 days). Audit-logged (`guild.ban`).
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  // Lifts a ban. Requires BAN_MEMBERS. NOT_FOUND if the user is not banned.
  // Audit-logged (`guild.unban`).
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  // Lists the guild's bans, newest first. Requires BAN_MEMBERS.
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  // Leaves a guild. The owner cannot leave (FAILED_PRECONDITION): transfer
  // ownership or delete the guild first. Publishes guild_member_removed
  // (reason LEFT) and guild_removed to the caller's streams.
  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse);
  // Deletes a channel and, in the background, its messages and files.
  // Requires MANAGE_CHANNELS. Reads of the channel fail with NOT_FOUND at once.
  // Everyone in a voice channel leaves it. Publishes channel_deleted and
  // layout_updated. Audit-logged (`channel.delete`).
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  // Deletes a guild with everything in it (owner only; `confirm_name` must
  // equal the guild's name). The guild disappears at once; channels, messages,
  // roles, emojis, bans, invites and stored files are removed in the
  // background. Publishes guild_removed to every member. Audit-logged
  // (`guild.delete`).
  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse);
  // Replaces the guild's invite code: the old one stops working at once.
  // Requires MANAGE_SERVER. Publishes guild_updated. Audit-logged
  // (`guild.rotate_invite`).
  rpc RotateInviteCode(RotateInviteCodeRequest) returns (RotateInviteCodeResponse);
  // Makes another current member the owner (owner only; `confirm_name` must
  // equal the guild's name). The previous owner becomes an ordinary member.
  // Publishes guild_updated. Audit-logged (`guild.transfer`).
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
}

// Request to kick a member.
message KickMemberRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // The member to remove.
  uint64 user_id = 2;
}

// Result of kicking a member.
message KickMemberResponse {}

// Request to ban a member.
message BanMemberRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // The user to ban; need not be a member.
  uint64 user_id = 2;
  // Why; at most 512 characters, shown in the ban list and the audit log.
  string reason = 3;
  // Also delete the user's messages from the last this-many seconds in the
  // guild's channels (done in the background); at most 604800 (7 days),
  // larger values are INVALID_ARGUMENT. Unset or 0 = keep their messages.
  optional uint32 delete_message_seconds = 4;
}

// Result of banning a user.
message BanMemberResponse {}

// Request to lift a ban.
message UnbanMemberRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // The banned user.
  uint64 user_id = 2;
}

// Result of lifting a ban.
message UnbanMemberResponse {}

// A ban of a user from a guild.
message Ban {
  // The banned user.
  User user = 1;
  // The moderator who banned them (0 if unknown).
  uint64 banned_by = 2;
  // The reason given; "" if none.
  string reason = 3;
  // When the ban was made.
  google.protobuf.Timestamp created_at = 4;
}

// Request to list bans.
message ListBansRequest {
  // ID of the guild.
  uint64 guild_id = 1;
}

// The bans of a guild.
message ListBansResponse {
  // Bans, newest first.
  repeated Ban bans = 1;
}

// Request to leave a guild.
message LeaveGuildRequest {
  // ID of the guild.
  uint64 guild_id = 1;
}

// Result of leaving a guild.
message LeaveGuildResponse {}

// Request to delete a channel.
message DeleteChannelRequest {
  // ID of the guild containing the channel.
  uint64 guild_id = 1;
  // ID of the channel.
  uint64 channel_id = 2;
}

// Result of deleting a channel.
message DeleteChannelResponse {
  // The resulting layout (version bumped).
  GuildLayout layout = 1;
}

// Request to delete a guild.
message DeleteGuildRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // Must equal the guild's name (INVALID_ARGUMENT otherwise).
  string confirm_name = 2;
}

// Result of deleting a guild.
message DeleteGuildResponse {}

// Request to rotate the invite code.
message RotateInviteCodeRequest {
  // ID of the guild.
  uint64 guild_id = 1;
}

// Result of rotating the invite code.
message RotateInviteCodeResponse {
  // The new invite code.
  string invite_code = 1;
}

// Request to transfer ownership.
message TransferOwnershipRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // The new owner; must be a member other than the caller.
  uint64 user_id = 2;
  // Must equal the guild's name (INVALID_ARGUMENT otherwise).
  string confirm_name = 3;
}

// Result of transferring ownership.
message TransferOwnershipResponse {
  // The updated guild.
  Guild guild = 1;
}

// Request to create a guild.
message CreateGuildRequest {
  // Display name of the new guild.
  string name = 1;
}

// Result of creating a guild.
message CreateGuildResponse {
  // The newly created guild.
  Guild guild = 1;
}

// Request to list the caller's guilds.
message ListMyGuildsRequest {}

// The caller's guilds.
message ListMyGuildsResponse {
  // Guilds the caller is a member of.
  repeated Guild guilds = 1;
}

// Request to join a guild.
message JoinGuildRequest {
  // Invite code of the guild to join.
  string invite_code = 1;
}

// Result of joining a guild.
message JoinGuildResponse {
  // The guild that was joined.
  Guild guild = 1;
}

// Request to list guild members.
message ListGuildMembersRequest {
  // ID of the guild.
  uint64 guild_id = 1;
}

// Members of a guild.
message ListGuildMembersResponse {
  // Users that are members of the guild. Kept for compatibility; equals
  // `members[*].user`.
  repeated User users = 1;
  // Members of the guild, with their roles.
  repeated Member members = 2;
}

// Request to create a channel.
message CreateChannelRequest {
  // ID of the guild to create the channel in.
  uint64 guild_id = 1;
  // Display name of the new channel.
  string name = 2;
  // Section to put the channel in (appended last); unset = top level.
  // Must exist in the guild, else NOT_FOUND.
  optional uint64 section_id = 3;
  // Phosphor icon name (see Channel.icon); "" = default.
  string icon = 4;
  // Palette key (see types.proto); "" = none.
  string color = 5;
  // Three-way icon; if set it wins over `icon`. A custom emoji id must belong
  // to this guild (INVALID_ARGUMENT otherwise).
  optional ChannelIcon icon_ref = 6;
  // Text or voice; UNSPECIFIED = TEXT. Cannot be changed afterwards.
  ChannelKind kind = 7;
}

// Result of creating a channel.
message CreateChannelResponse {
  // The newly created channel.
  Channel channel = 1;
}

// Request to list channels of a guild.
message ListChannelsRequest {
  // ID of the guild.
  uint64 guild_id = 1;
}

// Channels of a guild.
message ListChannelsResponse {
  // Channels belonging to the guild.
  repeated Channel channels = 1;
  // The guild's section/channel layout, including its current version.
  // (There is no separate GetLayout RPC; this saves a round trip.)
  GuildLayout layout = 2;
}

// Request to update guild settings.
message UpdateGuildRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // New display name, 1-100 characters; unset = unchanged.
  optional string name = 2;
}

// Result of updating a guild.
message UpdateGuildResponse {
  // The updated guild.
  Guild guild = 1;
}

// Request to update a channel. Unset fields are left unchanged.
message UpdateChannelRequest {
  // ID of the guild containing the channel.
  uint64 guild_id = 1;
  // ID of the channel.
  uint64 channel_id = 2;
  // New name (same normalisation and validation as CreateChannel).
  optional string name = 3;
  // New Phosphor icon name; "" resets to default. INVALID_ARGUMENT if it does
  // not match `^[a-z0-9]+(-[a-z0-9]+)*$` or exceeds 48 characters.
  optional string icon = 4;
  // New palette key; "" clears. INVALID_ARGUMENT if not in the palette.
  optional string color = 5;
  // New topic, at most 256 characters; "" clears.
  optional string topic = 6;
  // New three-way icon; if set it wins over `icon`. An icon_ref with no kind
  // resets to the default icon.
  optional ChannelIcon icon_ref = 7;
}

// Result of updating a channel.
message UpdateChannelResponse {
  // The updated channel.
  Channel channel = 1;
}

// Request to create a section.
message CreateSectionRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // Display name, 1-100 characters.
  string name = 2;
}

// Result of creating a section.
message CreateSectionResponse {
  // The new section.
  Section section = 1;
  // The resulting layout (version bumped).
  GuildLayout layout = 2;
}

// Request to rename a section.
message UpdateSectionRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // ID of the section.
  uint64 section_id = 2;
  // New display name, 1-100 characters.
  string name = 3;
}

// Result of renaming a section.
message UpdateSectionResponse {
  // The updated section.
  Section section = 1;
  // The resulting layout (version bumped).
  GuildLayout layout = 2;
}

// Request to delete a section.
message DeleteSectionRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // ID of the section.
  uint64 section_id = 2;
}

// Result of deleting a section.
message DeleteSectionResponse {
  // The resulting layout (version bumped).
  GuildLayout layout = 1;
}

// Request to replace the layout. The desired layout must be a permutation of
// the guild's current sections and channels: the same set of section IDs and
// channel IDs, none missing, none duplicated, none unknown; every channel in
// exactly one entry. Creating, renaming or deleting is done with the other
// RPCs, not here.
message UpdateLayoutRequest {
  // ID of the guild.
  uint64 guild_id = 1;
  // The layout version the client based its edit on. If it differs from the
  // server's current version the call fails with ABORTED (the client should
  // refetch via ListChannels and retry); no changes are applied.
  uint64 expected_version = 2;
  // Desired section order (section IDs; never 0).
  repeated uint64 section_ids = 3;
  // Desired channel order per section; section_id 0 = top level. A missing
  // entry means that section has no channels. INVALID_ARGUMENT if the
  // arguments are not a permutation of the current state.
  repeated LayoutEntry entries = 4;
}

// Result of updating the layout.
message UpdateLayoutResponse {
  // The new layout, with the version incremented.
  GuildLayout layout = 1;
}
