# cargo-deny policy, shared by server/ and client/ (CI runs it per workspace).
# Advisories only WARN for now: fix or acknowledge them, then switch to errors.

[graph]
all-features = false

[advisories]
version = 2
# Warn on unmaintained/unsound/yanked crates as well as vulnerabilities.
unmaintained = "workspace"
yanked = "warn"
# Vulnerabilities are errors by default in v2; downgrade them to warnings (see top).
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "LicenseRef-thehideout",
]
confidence-threshold = 0.8

# The workspace crates are private (no license field).
[licenses.private]
ignore = true

# thehideout-server has no `license` / `publish = false` in its manifest.
[[licenses.clarify]]
crate = "thehideout-server"
expression = "LicenseRef-thehideout"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # Rune UI toolkit and its vendored forks (client/Cargo.toml).
  "https://github.com/anomalyco/rune",
]
