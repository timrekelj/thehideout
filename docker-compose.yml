services:
  scylla:
    image: scylladb/scylla:2025.4
    container_name: thehideout-scylla
    command: --smp 2 --memory 2G --overprovisioned 1 --developer-mode 1 --broadcast-rpc-address 127.0.0.1
    ports:
      # Localhost only: Scylla runs with AllowAllAuthenticator (no credentials),
      # so the CQL port must not be reachable from the network.
      - "127.0.0.1:9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # S3-compatible object storage for avatars and guild icons (later emojis).
  # SeaweedFS rather than MinIO: MinIO no longer publishes community images,
  # while SeaweedFS (Apache-2.0) ships an actively maintained image that runs
  # master + volume + S3 gateway in one small process (`weed server -s3`).
  # The server only needs the plain S3 API, so any provider can replace this.
  seaweedfs:
    image: chrislusf/seaweedfs:4.20
    container_name: thehideout-s3
    command: >
      server -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=512
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      # Localhost only: the credentials below are well-known dev values.
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: creates the bucket once SeaweedFS is healthy, then exits.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.20
    container_name: thehideout-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name thehideout-media" | weed shell -master=seaweedfs:9333

  # Development mail sink: the server sends here when no Resend API key is set.
  # Web inbox at http://127.0.0.1:8025 (also a JSON API at /api/v1/messages).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: thehideout-mailpit
    ports:
      # Localhost only: anyone who can reach these reads every dev email.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Voice channels: a self-hosted LiveKit SFU carries the audio / video; the
  # server only issues join tokens and keeps track of who is in which channel.
  # Clients connect to ws://127.0.0.1:7880 (LIVEKIT_URL). LiveKit posts room /
  # participant webhooks to the server running on the host (see the config
  # below); `host-gateway` makes host.docker.internal work on Linux too.
  # No healthcheck: the image has no shell or wget. Check with
  # `curl http://127.0.0.1:7880` (prints OK).
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: thehideout-livekit
    command: --config /etc/livekit.yaml
    ports:
      # Localhost only: the API key below is a well-known dev value.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50100:50000-50100/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: livekit-config
        target: /etc/livekit.yaml

configs:
  # Local-only development credentials (match the server's defaults).
  livekit-config:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 50100
        # Media candidates must be reachable at the published, loopback-only ports.
        use_external_ip: false
        node_ip: 127.0.0.1
      # LiveKit logs "secret is too short" for this on startup; harmless for a
      # loopback-only dev server. Use a 32+ character secret anywhere else.
      keys:
        devkey: secret
      webhook:
        api_key: devkey
        urls:
          - http://host.docker.internal:8080/livekit/webhook
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "thehideout",
            "credentials": [
              { "accessKey": "thehideout-dev", "secretKey": "thehideout-dev-secret" }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  scylla-data:
  seaweedfs-data:
