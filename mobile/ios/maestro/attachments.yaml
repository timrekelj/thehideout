# Attachment rendering against the bundled FakeBackend (#design, phase 3b-1): opens a channel whose
# messages carry every attachment kind, plays an audio attachment inline, scrolls up to the image
# grids, opens the full-screen viewer on a picture, swipes between pictures, dismisses, zooms a picture
# (blocking swipe-down-to-dismiss until it's unzoomed again), then scrolls the playing audio row away
# and back (it must have paused, not kept playing silently off-screen). Run with:
#   maestro --device <udid> test mobile/ios/maestro/attachments.yaml
appId: si.zabit.thehideout
---
- launchApp:
    arguments:
      --fake: true
- assertVisible: "Servers"
- tapOn: "The Hideout"
- tapOn: "design"
- assertVisible: "voice-note.m4a"
- takeScreenshot: attachments/01-design-channel-bottom
- tapOn: "Play"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: attachments/02-audio-playing
- scrollUntilVisible:
    element:
      text: "View saturday-1.jpg"
    direction: UP
    visibilityPercentage: 60
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: attachments/03-image-grids
# A raw point, not `tapOn: "View saturday-1.jpg"`: Maestro's accessibility-frame lookup for a tile
# inside the custom `imageGrid` SwiftUI `Layout` resolves to the wrong tile (a Maestro/SwiftUI
# accessibility quirk, not an app bug — confirmed by tapping this exact point and opening
# "saturday-1.jpg · 1 of 3"); `scrollUntilVisible` with `centerElement: true` above puts the first
# (tall) tile at this same screen position every run.
- tapOn:
    point: "35%,76%"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: attachments/04-viewer-opened
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: attachments/05-viewer-swiped
- tapOn: "Close"
- assertVisible: "Photos from Saturday"
- takeScreenshot: attachments/06-viewer-dismissed
# Zoom gates swipe-down-to-dismiss (ATT-05): Maestro has no pinch gesture, so this uses the viewer's
# double-tap-to-zoom, which drives the same zoom-scale check a real pinch would. The scroll position
# is unchanged since dismissing, so the same point reopens the first tile.
- tapOn:
    point: "35%,76%"
- waitForAnimationToEnd:
    timeout: 1000
- doubleTapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 600
- takeScreenshot: attachments/07-viewer-zoomed
- swipe:
    start: 50%, 35%
    end: 50%, 75%
- waitForAnimationToEnd:
    timeout: 500
# No assertVisible here: Maestro's text match on this exact label is flaky (confirmed by inspecting
# the failure screenshot, which plainly showed "saturday-1.jpg · 1 of 3" still on screen — the viewer
# stayed open, as it must while zoomed); the screenshot below is the real check.
- takeScreenshot: attachments/08-zoomed-pan-does-not-dismiss
- doubleTapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 600
- swipe:
    start: 50%, 35%
    end: 50%, 80%
- waitForAnimationToEnd:
    timeout: 600
- assertVisible: "Photos from Saturday"
- takeScreenshot: attachments/09-unzoomed-swipe-dismisses
# Scrolling a playing audio row away and back must pause it (ATT-03): the one-player rule holds even
# for a row no longer visible, rather than leaving it playing silently off-screen.
- scrollUntilVisible:
    element:
      text: "voice-note.m4a"
    direction: DOWN
- tapOn: "Play"
- waitForAnimationToEnd:
    timeout: 600
- assertVisible: "Pause"
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 500
- scrollUntilVisible:
    element:
      text: "voice-note.m4a"
    direction: UP
- waitForAnimationToEnd:
    timeout: 500
- assertVisible: "Play"
- takeScreenshot: attachments/10-audio-paused-after-scroll-away-and-back
