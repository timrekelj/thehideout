[package]
name = "thehideout-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "thehideout_server"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "thehideout-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.22"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
bytes = "1.12.2"
chrono = "0.4"
connectrpc = { version = "0.9", features = ["axum"] }
dotenvy = "0.15.7"
futures = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
livekit-api = { version = "0.11", default-features = false, features = ["access-token", "webhooks", "services", "rustls-tls-webpki-roots"] }
object_store = { version = "0.14", features = ["aws"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
scylla = { version = "1", features = ["chrono-04", "rustls-023"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
totp-rs = { version = "5", features = ["otpauth"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1"
url = "2"
webauthn-rs = "0.6.2"

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
connectrpc = { version = "0.9", features = ["axum", "client"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
