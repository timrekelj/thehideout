name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  server:
    name: server (clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Start Scylla, SeaweedFS, Mailpit, LiveKit, then create the bucket
        run: |
          docker compose up -d --wait scylla seaweedfs mailpit livekit
          docker compose up seaweedfs-init
      - name: clippy
        working-directory: server
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: server
        run: cargo test --locked
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  proto:
    name: proto (buf lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - name: buf breaking (against the previous commit)
        if: github.event_name == 'push'
        run: buf breaking --against ".git#ref=HEAD~1" || echo "::warning::no previous commit to compare against"

  client:
    name: client (macOS)
    # The desktop app uses Metal and libwebrtc: build and test it on macOS.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      # Tests that need a running server are not run here.
      - name: test design + desktop
        run: cargo test --locked -p thehideout-design -p thehideout-desktop --bin thehideout-desktop
      - name: test api (lib only)
        run: cargo test --locked -p thehideout-api --lib
      # mobile/tokens/tokens.json is exported from the design crate; a token change must land with it.
      - name: mobile tokens.json is current
        run: |
          cargo run --locked -q -p thehideout-design --example export_tokens -- "$RUNNER_TEMP/tokens.json"
          diff -q "$RUNNER_TEMP/tokens.json" ../mobile/tokens/tokens.json || {
            echo "::error::mobile/tokens/tokens.json is stale: cd client && cargo run -p thehideout-design --example export_tokens -- ../mobile/tokens/tokens.json && python3 -I ../mobile/tokens/generate.py"; exit 1; }

  mobile:
    name: mobile (tokens, API clients, HideoutAPI)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: generated design tokens are current
        run: python3 -I mobile/tokens/generate.py --check
      - name: generated API clients are current
        run: mobile/api/generate.sh --check
      - name: swift build HideoutAPI
        working-directory: mobile/ios/Packages/HideoutAPI
        run: swift build

  ios:
    name: ios (HideoutCore tests, app build, unit tests)
    # macOS 26 images carry Xcode 26 (the iOS 26 SDK the Liquid Glass APIs need).
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        working-directory: .
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: swift test (HideoutCore, on macOS)
        working-directory: mobile/ios/Packages/HideoutCore
        run: swift test
      # project.yml is the source; the generated project is committed so xcodebuild needs no extra tools.
      - name: project.yml and Hideout.xcodeproj agree
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Hideout.xcodeproj || {
            echo "::error::Hideout.xcodeproj is stale: cd mobile/ios && xcodegen generate"; exit 1; }
      - name: xcodebuild build (iOS Simulator)
        run: |
          xcodebuild -project Hideout.xcodeproj -scheme Hideout -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # The snapshot tests (GallerySnapshotTests, ShellSnapshotTests, AuthSnapshotTests) are skipped here: their
      # references are recorded on one simulator runtime (iPhone 18 Pro, iOS 27.2) and Liquid Glass renders
      # slightly differently across runtimes, so GitHub's images would fail them for the wrong reason. They run
      # locally (see mobile/ios/README.md) until a runner matches. The unit tests (look persistence, tokens) do run.
      # HideoutUITests is not run here either (see mobile/ios/README.md, "UI tests"): it drives real touch events
      # and system UI (the keyboard, the strong-password callout) that is unreliable on a headless CI runner.
      - name: xcodebuild test (unit tests; snapshot and UI tests skipped)
        run: |
          device="$(xcrun simctl list devices available | grep -E '^ +iPhone [0-9]+ Pro \(' | head -1 | sed -E 's/^ +//; s/ \(.*//')"
          echo "Testing on: $device"
          xcodebuild -project Hideout.xcodeproj -scheme Hideout -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test \
            -only-testing:HideoutTests -skip-testing:HideoutTests/GallerySnapshotTests -skip-testing:HideoutTests/ShellSnapshotTests \
            -skip-testing:HideoutTests/AuthSnapshotTests

  android:
    name: android (unit tests, debug build, snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships an SDK; this makes sure the platform the project compiles against is there.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests (:core, JUnit 5) and debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - name: Roborazzi snapshots match the committed references
        run: ./gradlew :ui:verifyRoborazziDebug --stacktrace
      - name: snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-snapshot-diffs
          path: mobile/android/ui/build/outputs/roborazzi
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licenses, bans, sources (blocking)
        run: cargo deny --manifest-path ${{ matrix.manifest }}/Cargo.toml --config deny.toml check bans licenses sources
      # Advisories are non-blocking for now: RUSTSEC-2023-0071 (rsa, via webauthn-rs,
      # no fix released) and RUSTSEC-2026-0543 (chrono unmaintained). Make this step
      # blocking once they are resolved or explicitly ignored in deny.toml.
      - name: advisories (warn only)
        continue-on-error: true
        run: cargo deny --manifest-path ${{ matrix.manifest }}/Cargo.toml --config deny.toml check advisories

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: thehideout-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate the production compose file and Caddyfile
        run: |
          cd deploy
          cp .env.production.example .env.production
          # Fill every variable compose requires (${VAR:?...}) that the example leaves empty.
          grep -oE '\$\{[A-Z0-9_]+:\?' compose.yml | sed 's/^\${//; s/:?$//' | sort -u | while read -r var; do
            sed -i "s/^${var}=\$/${var}=ci/" .env.production
          done
          docker compose --env-file .env.production config -q
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e THEHIDEOUT_DOMAIN=hideout.example.com -e LIVEKIT_DOMAIN=voice.example.com -e ACME_EMAIL=a@example.com \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
