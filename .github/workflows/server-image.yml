name: server-image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "proto/**"
      - "buf.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - ".github/workflows/server-image.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/timrekelj/thehideout-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: redeploy the Dokploy Compose service so it pulls the new
      # `latest`. Only for main pushes (the `latest` tag). See
      # deploy/dokploy/README.md, "Auto-deploy".
      - name: Redeploy on Dokploy
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_COMPOSE_ID are not all set; skipping Dokploy redeploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg title "server-image ${GITHUB_SHA::7}" '{composeId: $id, title: $title}')"
          echo "Dokploy redeploy requested."
